name: Server image

# Builds the PocketBase image for the Raspberry Pi (arm64) and publishes it, then the runner on the Pi redeploys.
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/lilyanlefevre/puzzleit-server:latest

  deploy:
    needs: image
    runs-on: self-hosted # the runner installed on the Raspberry Pi (outbound connection only)
    steps:
      # A fixed clone, not the runner workspace: actions/checkout would `git clean` the pb_data folder.
      - run: |
          cd "$HOME/PuzzleIt/server"
          git pull --ff-only
          docker compose --profile tunnel up -d --pull always
          docker image prune -f
