name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports
          path: |
            app/build/reports/tests

  instrumented:
    name: Instrumented tests (${{ matrix.device }})
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        # Both are Gradle Managed Devices defined in app/build.gradle.kts: the same devices run on the PC with
        # ./gradlew <device>DebugAndroidTest. A current phone, and a small one (320 dp wide).
        # The small phone only runs the user journeys: its profile (Nexus One) has a 192 MB Java heap, too small for the
        # algorithm's device tests, and the screen size is what it is there for.
        include:
          - { device: pixel6api34, filter: "" }
          - { device: smallphoneapi34, filter: "-Pandroid.testInstrumentationRunnerArguments.package=com.lilyan_lefevre.puzzleit.e2e" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on the managed device
        run: ./gradlew ${{ matrix.device }}DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect ${{ matrix.filter }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports-${{ matrix.device }}
          path: app/build/reports/androidTests
